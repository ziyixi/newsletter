# docker-compose.test.yml — Integration test with mocked external services
#
# All external APIs are mocked by the Go fake-server. No real servers are called.
# Usage: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
#   make test

services:
  fake-server:
    build: tests/fake-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 5

  newsletter:
    build: .
    depends_on:
      fake-server:
        condition: service_healthy
    environment:
      # Point all services at the fake server (mocks only, no real APIs)
      - WEATHER_API_BASE=http://fake-server:8080
      - HN_API_BASE=http://fake-server:8080
      - GITHUB_TRENDING_BASE=http://fake-server:8080
      - TODO_API_BASE=http://fake-server:8080
      - NEWS_FEEDS=http://fake-server:8080/rss/feed
      - YAHOO_CHART_BASE=http://fake-server:8080
      - ARXIV_API_BASE=http://fake-server:8080
      - TRANSLATE_API_BASE=http://fake-server:8080
      # Disable LLM ranking in tests (no Gemini call)
      - RANKING_ENABLED=false
      # Dummy auth for todo API
      - TODO_API_USER=test
      - TODO_API_PASSWORD=test
    command: ["e2e"]
