[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-newsletter"
version = "0.1.0"
description = "One private service for research intake, editorial work, and reviewed newsletters"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.4", "httpx==0.28.1",
  "protobuf==7.36.1", "jinja2==3.1.6", "pillow==12.3.0",
  "ziyixi-protos==0.1.0.dev1",
]

[project.optional-dependencies]
codex = ["openai-codex==0.147.0"]

[dependency-groups]
dev = [
  "pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.6",
  "mypy==2.3.1", "types-protobuf==7.35.1.20260827",
]

[tool.uv]
required-version = "==0.12.10"

[tool.uv.sources]
ziyixi-protos = {url = "https://github.com/ziyixi/protos/releases/download/python-v0.1.0.dev1/ziyixi_protos-0.1.0.dev1-py3-none-any.whl"}

[project.scripts]
newsletter = "newsletter.cli:main"
newsletter-trigger = "newsletter.trigger:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newsletter = ["templates/*", "policy/*", "instructions/*.md", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
cache_dir = ".artifacts/cache/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = ".artifacts/cache/ruff"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
cache_dir = ".artifacts/cache/mypy"
files = ["src/newsletter"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
