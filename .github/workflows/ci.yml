name: Newsletter Service CI

on:
  push:
    branches: [main]
    paths-ignore: ['content-config/**']
  pull_request:
    branches: [main]
    paths-ignore: ['content-config/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: make setup
      - run: make check
      - name: Verify real Codex startup twice without login or model calls
        run: make smoke-codex
      - run: make smoke
      - run: make build
      - name: Verify wheel resources and offline preview outside the source checkout
        run: |
          uv run --locked --extra codex python scripts/smoke_wheel.py
      # No secrets or ChatGPT login are used in CI. No send job here.

  image:
    # Standard Ubuntu x64 runner: native amd64, not an emulated ARM build.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the final image on native linux/amd64
        id: build
        run: |
          test "$(uname -m)" = x86_64
          python3 scripts/smoke_image.py --audit-source
          docker build --platform linux/amd64 --tag "newsletter-ci:${GITHUB_SHA}" .
          echo "image_id=$(docker image inspect --format '{{.Id}}' "newsletter-ci:${GITHUB_SHA}")" >> "$GITHUB_OUTPUT"
      - name: Verify that exact image without credentials or external networking
        env:
          TESTED_IMAGE: ${{ steps.build.outputs.image_id }}
        run: python3 scripts/smoke_image.py --image "$TESTED_IMAGE" --platform linux/amd64
      - name: Validate authored content using that exact engine image
        env:
          TESTED_IMAGE: ${{ steps.build.outputs.image_id }}
        run: |
          python3 scripts/publish_content_config.py validate \
            --image "$TESTED_IMAGE" --engine-sha "$GITHUB_SHA" \
            --revision "$GITHUB_SHA" --source "$GITHUB_WORKSPACE/content-config" \
            --output "$RUNNER_TEMP/engine-content-config"
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image, without rebuilding
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TESTED_IMAGE: ${{ steps.build.outputs.image_id }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in "service-${GITHUB_SHA}" service; do
            docker tag "$TESTED_IMAGE" "$image:$tag"
            test "$(docker image inspect --format '{{.Id}}' "$image:$tag")" = "$TESTED_IMAGE"
            docker push "$image:$tag"
          done
          # Publishing neither deploys the service nor triggers collection or mail.
