syntax = "proto3";

package newsletter;

option go_package = "newsletter-backend/pb";

// NewsletterPayload is the top-level message serialized to JSON
// for the email-service to consume.
message NewsletterPayload {
  string recipient_name = 1;
  string date = 2;
  WeatherData weather = 3;
  repeated NewsItem top_news = 4;
  repeated StockInfo stocks = 5;
  repeated HNStory hn_stories = 6;
  repeated GitHubRepo github_trending = 7;
  repeated ArxivPaper arxiv_papers = 8;
  repeated ExchangeRate exchange_rates = 9;
  repeated TodoTask todo_tasks = 10;
}

// WeatherData contains current conditions, forecast, and astronomy data.
message WeatherData {
  string location = 1;
  string condition = 2;
  string icon = 3;
  int32 temp_current = 4;
  int32 temp_high = 5;
  int32 temp_low = 6;
  string summary = 7;
  repeated ForecastDay forecasts = 8;
  // Astronomy fields (merged from astronomy service).
  string sunrise = 9;
  string sunset = 10;
  string day_length = 11;
  string golden_hour = 12;
  string astro_note = 13;
}

// ForecastDay is a single day in the 3-day weather forecast.
message ForecastDay {
  string label = 1;
  string icon = 2;
  string condition = 3;
  int32 high = 4;
  int32 low = 5;
}

// AstronomyData holds sunrise/sunset data before merging into WeatherData.
message AstronomyData {
  string sunrise = 1;
  string sunset = 2;
  string day_length = 3;
  string golden_hour = 4;
  string note = 5;
}

// NewsItem is a translated news headline from RSS feeds.
message NewsItem {
  string headline = 1;
  string summary = 2;
  string source = 3;
  string url = 4;
  string category = 5;
}

// StockInfo is a stock or ETF quote.
message StockInfo {
  string symbol = 1;
  string company_name = 2;
  double price = 3;
  double change = 4;
  double change_percent = 5;
}

// HNStory is a Hacker News front-page story.
message HNStory {
  string title = 1;
  string title_cn = 2;
  string url = 3;
  int32 points = 4;
  int32 comment_count = 5;
  string hn_url = 6;
}

// GitHubRepo is a GitHub trending repository.
message GitHubRepo {
  string name = 1;
  string description = 2;
  string description_cn = 3;
  string language = 4;
  int32 stars = 5;
  int32 today_stars = 6;
  string url = 7;
}

// ArxivPaper is an arXiv paper with AI-generated summary.
message ArxivPaper {
  string title = 1;
  string title_cn = 2;
  string summary = 3;
  string authors = 4;
  string url = 5;
  string category = 6;
}

// ExchangeRate is a currency exchange rate.
message ExchangeRate {
  string pair = 1;
  double rate = 2;
  double change = 3;
  double change_percent = 4;
  string display_name = 5;
}

// TodoTask is a recommended todo task.
message TodoTask {
  int32 rank = 1;
  string title = 2;
  string reason = 3;
}
